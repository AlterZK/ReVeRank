function openImageExporter(p,ids){
 const overlay=document.createElement('div');overlay.className='export-overlay';overlay.innerHTML=`<div class="export-modal" role="dialog" aria-modal="true" aria-labelledby="exportHeading"><div class="export-header"><div><div class="eyebrow">SHARE YOUR RESULTS</div><h2 id="exportHeading">Create a ranking poster</h2></div><div class="export-header-buttons"><button class="btn primary sm" id="savePoster">⇩ Download picture</button><button class="btn ghost sm" id="exportClose">✕ Close</button></div></div><div class="export-layout"><div class="export-controls"><label>Poster title<input class="input" id="posterTitle" maxlength="110" value="${escapeHTML(p.title)}"></label><div class="poster-theme-select"><div class="poster-theme-caption">POSTER DESIGN · CHOOSE YOUR VIBE</div><select class="hidden" id="posterTheme" aria-label="Poster theme">${Object.entries(EXPORT_THEMES).map(([key,t])=>`<option value="${key}">${t.label}</option>`).join('')}</select><div class="poster-theme-grid" id="posterThemeGrid">${Object.entries(EXPORT_THEMES).map(([key,t])=>`<button type="button" class="poster-theme-chip ${key==='violet'?'active':''}" data-poster-theme="${key}" title="${t.label}" aria-pressed="${key==='violet'}"><span class="poster-swatch" style="background:linear-gradient(140deg,${t.bg} 49%,${t.accent} 50%);color:${t.text}">${t.emoji}</span><span>${t.label}</span></button>`).join('')}</div><p class="hint">Creative themes inspired by Red Velvet’s album eras, with original decorative artwork.</p></div><label>Image format<select class="input" id="posterFormat"><option value="png">PNG (best quality)</option><option value="jpeg">JPEG (smaller file)</option></select></label><label>Layout<select class="input" id="posterLayout"><option value="portrait">Portrait · 1080 × 1350</option><option value="square">Square · 1080 × 1080</option><option value="widescreen">Widescreen · 1600 × 900 (16:9)</option></select></label><label>Show in ranking list<select class="input" id="posterListMode"><option value="10">Top 10</option><option value="20">Top 20</option><option value="50">Top 50</option><option value="100">Top 100</option><option value="all">All items</option><option value="custom">Custom amount…</option></select></label><label id="posterCustomWrap" class="hidden">Custom amount<input class="input" id="posterCustomCount" type="number" min="1" max="${p.items.length}" step="1" value="${Math.min(25,p.items.length)}"></label><label class="export-check"><input type="checkbox" id="posterImages" checked> Include item images</label><p class="hint">Highlights the top three, then shows as many ranked items as you want — including the full list. 16:9 is available too. If you export a very long list, the image may become taller than the base layout so everything still fits cleanly.</p><div class="notice" id="posterStatus" aria-live="polite"></div></div><div><img class="export-preview" id="posterPreview" alt="Preview of your ranking poster"></div></div></div>`;
 document.body.appendChild(overlay);const el=id=>overlay.querySelector('#'+id);
 const options=()=>({title:el('posterTitle').value.trim()||p.title,theme:el('posterTheme').value,format:el('posterFormat').value,layout:el('posterLayout').value,images:el('posterImages').checked,listMode:el('posterListMode').value,customCount:el('posterCustomCount').value});
 const syncCustom=()=>el('posterCustomWrap').classList.toggle('hidden',el('posterListMode').value!=='custom');

 el('savePoster').onclick=async()=>{const button=el('savePoster');button.disabled=true;el('posterStatus').textContent='Creating file…';try{let opt=options(),canvas=await makeRankingPoster(p,ids,opt);const mime=opt.format==='jpeg'?'image/jpeg':'image/png';const count=getPosterListCount(p.items.length,opt);const label=count>=p.items.length?'full-ranking':'top-'+count;canvas.toBlob(blob=>{button.disabled=false;if(!blob){el('posterStatus').textContent='Could not export image';return}let url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=safeName(opt.title)+'-'+label+'.'+opt.format;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);el('posterStatus').textContent='Picture downloaded';},mime,.93)}catch(err){button.disabled=false;el('posterStatus').textContent=err.message}};

}
function loadPosterImage(src){return new Promise(resolve=>{if(!src)return resolve(null);const img=new Image();let finished=false;const done=result=>{if(finished)return;finished=true;clearTimeout(timer);img.onload=null;img.onerror=null;if(!result)img.src='';resolve(result)};const timer=setTimeout(()=>done(null),5000);if(/^https?:/i.test(src))img.crossOrigin='anonymous';img.onload=()=>done(img);img.onerror=()=>done(null);img.src=src})}
function posterRound(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function posterFitted(ctx,str,x,y,width,font=32,weight=700,color='#fff',align='left'){ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;let size=font;ctx.font=`${weight} ${size}px system-ui, sans-serif`;while(ctx.measureText(str).width>width &&size>15){size-=1;ctx.font=`${weight} ${size}px system-ui, sans-serif`}let label=str;while(ctx.measureText(label).width>width &&label.length>2){label=label.slice(0,-2)+'…'}ctx.fillText(label,x,y)}
function posterCover(ctx,img,x,y,size,r,fallback,colors){ctx.save();posterRound(ctx,x,y,size,size,r);ctx.clip();ctx.fillStyle=colors.panel;ctx.fillRect(x,y,size,size);if(img){let crop=Math.max(size/img.width,size/img.height),sw=size/crop,sh=size/crop;ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,x,y,size,size)}else{posterFitted(ctx,(fallback||'?').charAt(0).toUpperCase(),x+size/2,y+size/2,size*.9,size*.48,800,colors.accent,'center')}ctx.restore()}
function getPosterListCount(total,opt){if(opt.listMode==='all')return total;if(opt.listMode==='custom'){const n=parseInt(opt.customCount,10);return Math.max(1,Math.min(total,Number.isFinite(n)?n:10))}const n=parseInt(opt.listMode,10);return Math.max(1,Math.min(total,Number.isFinite(n)?n:10))}
function getPosterLayoutSpec(layout,count){
 const key=layout==='widescreen'?'widescreen':layout==='square'?'square':'portrait';
 const map={
  portrait:{width:1080,baseHeight:1350,pad:65,topGap:35,listWidth:950,titleWidth:945,glow:[930,80,850]},
  square:{width:1080,baseHeight:1080,pad:65,topGap:30,listWidth:950,titleWidth:945,glow:[930,80,850]},
  widescreen:{width:1600,baseHeight:900,pad:70,topGap:26,listWidth:1460,titleWidth:1360,glow:[1380,90,980]}
 };
 const spec=map[key];
 if(key==='portrait'){spec.columns=count<=15?1:count<=48?2:3;spec.rowH=count<=15?61:count<=48?46:37}
 else if(key==='square'){spec.columns=count<=12?1:count<=30?2:3;spec.rowH=count<=12?56:count<=30?42:35}
 else{spec.columns=count<=18?2:count<=60?3:4;spec.rowH=count<=18?46:count<=60?36:31}
 spec.gap=spec.columns===1?4:8;return spec
}
function posterTitleLines(ctx,title,maxWidth,maxLines,fontSize){let words=(title||'My ranking').trim().split(/\s+/).filter(Boolean);let lines=[''];ctx.font=`800 ${fontSize}px system-ui, sans-serif`;for(const word of words){const at=lines.length-1,test=(lines[at]+' '+word).trim();if(ctx.measureText(test).width>maxWidth&&lines[at]&&lines.length<maxLines)lines.push(word);else lines[at]=test}return lines}
function posterStar(ctx,x,y,outer,points=5){ctx.beginPath();for(let j=0;j<points*2;j++){const theta=Math.PI*j/points-Math.PI/2,r=j%2?outer*.42:outer;const px=x+Math.cos(theta)*r,py=y+Math.sin(theta)*r;j?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}
function posterHeart(ctx,x,y,r){ctx.beginPath();ctx.moveTo(x,y+r*.9);ctx.bezierCurveTo(x-r*2,y-r*.1,x-r*.9,y-r*1.4,x,y-r*.5);ctx.bezierCurveTo(x+r*.9,y-r*1.4,x+r*2,y-r*.1,x,y+r*.9);ctx.closePath()}
function paintPosterTheme(ctx,W,H,theme){
 const kind=theme.pattern||'stars';ctx.save();
 // Original atmospheric patterns — no album artwork is embedded or reproduced.
 const dist=i=>{const v=Math.sin(i*137.508+13)*43758.5453;return v-Math.floor(v)};
 const count=Math.min(220,Math.ceil(W*H/10500));
 for(let i=0;i<count;i++){
  const x=dist(i+9)*W,y=dist(i+113)*H,r=5+dist(i+56)*28;
  ctx.save();ctx.translate(x,y);ctx.rotate(dist(i+70)*6.28);ctx.globalAlpha=kind==='pop'||kind==='sprinkles'?.17:.13;
  ctx.strokeStyle=theme.accent;ctx.fillStyle=theme.accent;ctx.lineWidth=2.5;
  if(kind==='stars'){posterStar(ctx,0,0,r*.75,4);ctx.fill()}
  else if(kind==='flowers'||kind==='petals'){
   const petals=kind==='flowers'?6:5;for(let j=0;j<petals;j++){ctx.beginPath();ctx.ellipse(Math.cos(j*Math.PI*2/petals)*r*.48,Math.sin(j*Math.PI*2/petals)*r*.48,r*.34,r*.54,j*Math.PI*2/petals,0,Math.PI*2);ctx.stroke()}ctx.beginPath();ctx.arc(0,0,r*.16,0,Math.PI*2);ctx.fill()
  }else if(kind==='bubbles'){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke()}
  else if(kind==='sprinkles'){ctx.fillRect(-r*.5,-3,r,6)}
  else if(kind==='pop'){i%2?ctx.fillRect(-r*.3,-r*.3,r*.6,r*.6):(ctx.beginPath(),ctx.arc(0,0,r*.65,0,Math.PI*2),ctx.fill())}
  else if(kind==='hearts'){posterHeart(ctx,0,0,r*.55);ctx.fill()}
  else if(kind==='ribbon'){ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-r*1.4,-r,-r*1.4,r,0,0);ctx.bezierCurveTo(r*1.4,-r,r*1.4,r,0,0);ctx.stroke();ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill()}
  else if(kind==='lace'){ctx.beginPath();ctx.arc(0,0,r*.8,0,Math.PI*2);ctx.stroke();for(let t=0;t<8;t++){ctx.beginPath();ctx.arc(Math.cos(t*Math.PI/4)*r*.8,Math.sin(t*Math.PI/4)*r*.8,r*.26,0,Math.PI*2);ctx.stroke()}}
  else{ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(r,0);ctx.stroke()}
  ctx.restore();
 }
 // A decorative frame in the formal and nostalgic themes.
 if(['flowers','lace','ribbon'].includes(kind)){ctx.globalAlpha=.4;ctx.strokeStyle=theme.accent;ctx.lineWidth=3;posterRound(ctx,31,31,W-62,H-62,25);ctx.stroke();ctx.globalAlpha=.15;posterRound(ctx,41,41,W-82,H-82,22);ctx.stroke()}
 if(kind==='stars'){ctx.globalAlpha=.13;ctx.strokeStyle=theme.accent;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(W*.87,120,W*.3,95,-.3,0,Math.PI*2);ctx.stroke()}
 ctx.restore();
}
async function makeRankingPoster(p,ids,opt){
 const showCount=getPosterListCount(p.items.length,opt),showIds=ids.slice(0,showCount),theme=EXPORT_THEMES[opt.theme]||EXPORT_THEMES.violet,spec=getPosterLayoutSpec(opt.layout,showCount),W=spec.width,pad=spec.pad;
 const titleCanvas=document.createElement('canvas');titleCanvas.width=W;titleCanvas.height=200;const tctx=titleCanvas.getContext('2d');
 const titleFont=spec.width>=1500?74:65,titleLines=posterTitleLines(tctx,(opt.title||'My ranking').trim(),spec.titleWidth,opt.layout==='widescreen'?1:2,titleFont),titleStart=spec.width>=1500?156:166,titleLineGap=spec.width>=1500?80:74;
 const titleBlockBottom=titleStart+(titleLines.length-1)*titleLineGap;
 const topThreeCount=Math.min(3,showIds.length),cardY=titleBlockBottom+76,cardGap=spec.width>=1500?28:24;
 let cardW,cardH,picSize;
 if(spec.width>=1500){cardW=(W-pad*2-cardGap*2)/3;cardH=235;picSize=112}
 else{cardW=(W-pad*2-cardGap*2)/3;cardH=spec.baseHeight===1080?230:290;picSize=spec.baseHeight===1080?117:165}
 const afterCardsY=cardY+cardH+46;
 const headingSpace=36;const sectionHeadingFont=23;
 const rows=Math.ceil(showCount/spec.columns);const listGap=spec.gap;const listSectionHeight=rows*spec.rowH+Math.max(0,rows-1)*listGap;
 const footerReserve=60;
 const requiredH=afterCardsY+headingSpace+listSectionHeight+footerReserve;const H=Math.max(spec.baseHeight,requiredH);
 const can=document.createElement('canvas');can.width=W;can.height=H;let c=can.getContext('2d');c.fillStyle=theme.bg;c.fillRect(0,0,W,H);
 let [gx,gy,gr]=spec.glow;let glow=c.createRadialGradient(gx,gy,50,gx,gy,gr);glow.addColorStop(0,theme.accent+'36');glow.addColorStop(1,theme.accent+'00');c.fillStyle=glow;c.fillRect(0,0,W,H);
 paintPosterTheme(c,W,H,theme);
 const imageIds=[...new Set(showIds)];const imageMap={};let imgs=await Promise.all(imageIds.map(id=>opt.images?loadPosterImage(p.items[id].image):Promise.resolve(null)));imageIds.forEach((id,i)=>imageMap[id]=imgs[i]);
 c.fillStyle=theme.accent;c.fillRect(pad,58,59,7);posterFitted(c,'ReVeRank  /  YOUR PERSONAL RANKING',pad,101,W-pad*2,23,800,theme.accent);
 titleLines.forEach((line,i)=>posterFitted(c,line,pad,titleStart+i*titleLineGap,spec.titleWidth,titleFont,850,theme.text));
 posterFitted(c,'THE TOP THREE',pad,titleBlockBottom+38,W-pad*2,sectionHeadingFont,800,theme.accent);
 [1,0,2].filter(i=>i<topThreeCount).forEach((rank,col)=>{const x=pad+col*(cardW+cardGap);posterRound(c,x,cardY,cardW,cardH,25);c.fillStyle=theme.panel;c.fill();if(rank===0){c.strokeStyle=theme.accent;c.lineWidth=4;c.stroke()}const ix=x+(cardW-picSize)/2;posterCover(c,imageMap[showIds[rank]],ix,cardY+17,picSize,18,p.items[showIds[rank]].name,theme);posterFitted(c,'#'+(rank+1),x+20,cardY+picSize+44,70,spec.width>=1500?26:24,850,theme.accent);posterFitted(c,p.items[showIds[rank]].name,x+20,cardY+picSize+79,cardW-40,spec.width>=1500?24:26,750,theme.text)});
 let listY=afterCardsY;const listTitle=showCount>=p.items.length?'FULL RANKING':'TOP '+showCount;posterFitted(c,listTitle,pad,listY,W-pad*2,sectionHeadingFont,850,theme.accent);listY+=headingSpace;
 const listWidth=spec.listWidth;const colGap=spec.columns===1?0:18;const colW=(listWidth-colGap*(spec.columns-1))/spec.columns;
 for(let i=0;i<showIds.length;i++){
  const col=Math.floor(i/rows),row=i%rows;const x=pad+col*(colW+colGap),y=listY+row*(spec.rowH+listGap),id=showIds[i];
  posterRound(c,x,y,colW,spec.rowH,12);c.fillStyle=i<3?theme.panel:'#ffffff0b';c.fill();
  posterFitted(c,String(i+1).padStart(2,'0'),x+18,y+spec.rowH/2,48,Math.min(20,spec.rowH*0.43),800,i<3?theme.accent:theme.sub);
  const imSize=Math.max(22,spec.rowH-8);posterCover(c,imageMap[id],x+60,y+(spec.rowH-imSize)/2,imSize,7,p.items[id].name,theme);
  posterFitted(c,p.items[id].name,x+72+imSize,y+spec.rowH/2,colW-imSize-88,Math.min(22,spec.rowH*0.4),730,theme.text)
 }
 const footer=`${p.items.length} items  •  ${p.answers.length} comparisons  •  Made with ReVeRank`;posterFitted(c,footer,pad,H-30,W-pad*2,18,600,theme.sub);
 return can
}
